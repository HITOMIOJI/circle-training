function svg(q){let r=q.r,deg=q.deg||90,r2=q.r2||0,blue='#2563eb',fill='#bfdbfe',shade='#93c5fd',warm='#fde68a';if(['sector','arc','sectorPerimeter','sectorDiff','sectorSum','ringSector'].includes(q.kind)){let R=78,ir=r2?R*r2/r:0,cx=120,cy=105;const pt=(d,rr)=>[cx+rr*Math.cos((d-90)*Math.PI/180),cy+rr*Math.sin((d-90)*Math.PI/180)];const path=(d,rr)=>{let [x,y]=pt(d,rr);return `M${cx},${cy} L${cx},${cy-rr} A${rr},${rr} 0 ${d>180?1:0},1 ${x},${y} Z`};if(q.kind==='ringSector')return `<svg class="diagram" viewBox="0 0 240 220"><path d="${path(deg,R)}" fill="${shade}" stroke="${blue}" stroke-width="3"/><path d="${path(deg,ir)}" fill="white" stroke="${blue}" stroke-width="2"/><text x="132" y="48">外 ${r}cm</text><text x="132" y="70">内 ${r2}cm</text><text x="98" y="132">${deg}°</text></svg>`;return `<svg class="diagram" viewBox="0 0 240 220"><circle cx="120" cy="105" r="78" fill="${q.kind==='sectorDiff'?fill:'none'}" opacity="${q.kind==='sectorDiff'?'.55':'1'}" stroke="${q.kind==='sectorDiff'?blue:'none'}"/><path d="${path(deg,R)}" fill="${q.kind==='sectorDiff'?'white':fill}" stroke="${blue}" stroke-width="3"/><text x="98" y="132">${deg}°</text><text x="133" y="55">${r}cm</text></svg>`}if(q.kind==='ring'){let R=78,ir=R*r2/r;return `<svg class="diagram" viewBox="0 0 240 220"><circle cx="120" cy="105" r="${R}" fill="${shade}" stroke="${blue}" stroke-width="3"/><circle cx="120" cy="105" r="${ir}" fill="white" stroke="${blue}" stroke-width="2"/><text x="132" y="48">外 ${r}cm</text><text x="132" y="72">内 ${r2}cm</text></svg>`}if(['semi','semiPerimeter','twoSemi'].includes(q.kind))return `<svg class="diagram" viewBox="0 0 240 170"><path d="M42,125 A78,78 0 0,1 198,125 L42,125 Z" fill="${fill}" stroke="${blue}" stroke-width="3"/>${q.kind==='twoSemi'?`<path d="M42,135 A78,78 0 0,0 198,135 L42,135 Z" fill="#dbeafe" stroke="${blue}" stroke-width="2"/>`:''}<text x="135" y="116">${r}cm</text></svg>`;if(['quarter','quarterPerimeter'].includes(q.kind))return `<svg class="diagram" viewBox="0 0 220 210"><path d="M35,175 L35,35 A140,140 0 0,1 175,175 Z" fill="${fill}" stroke="${blue}" stroke-width="3"/><text x="55" y="162">${r}cm</text><text x="54" y="142">90°</text></svg>`;if(q.kind==='squareCircle')return `<svg class="diagram" viewBox="0 0 220 220"><rect x="25" y="15" width="170" height="170" fill="${warm}" stroke="#b45309" stroke-width="3"/><circle cx="110" cy="100" r="85" fill="white" stroke="${blue}" stroke-width="3"/><text x="87" y="205">10cm</text></svg>`;if(q.kind==='squareQuarter')return `<svg class="diagram" viewBox="0 0 220 220"><rect x="25" y="15" width="170" height="170" fill="${warm}" stroke="#b45309" stroke-width="3"/><path d="M25,185 L25,15 A170,170 0 0,1 195,185 Z" fill="white" stroke="${blue}" stroke-width="3"/><text x="87" y="205">10cm</text></svg>`;return `<svg class="diagram" viewBox="0 0 240 220"><circle cx="120" cy="105" r="78" fill="${fill}" stroke="${blue}" stroke-width="3"/><line x1="120" y1="105" x2="198" y2="105" stroke="#334155" stroke-width="2"/><text x="145" y="96">${r}cm</text></svg>`}
function render(){if(S.screen==='home')return homeView();if(S.done)return result();quiz()}function homeView(){app.innerHTML=`<main class="wrap"><header class="hero"><div style="font-size:52px">⭕</div><b style="color:#1d4ed8">苦手を克服！得意に変える！</b><h1>円とおうぎ形 完全トレーニング</h1><p class="muted">基本 → 定着 → 複合図形 → 中受実戦。図を見て、自分で式を選ぼう。</p></header>${steps.map((s,n)=>{let lock=!unlocked(n),cl=P.clear.includes(n),wc=(P.wrong[n]||[]).length;return `<div class="card ${lock?'locked':''}"><button class="step" ${lock?'disabled':''} onclick="openStep(${n})"><span class="bubble ${cl?'clear':''}">${cl?'✓':lock?'🔒':n+1}</span><span class="grow"><small style="color:#2563eb;font-weight:900">${s.level}</small><br><b style="font-size:19px">${s.name}</b><br><span class="muted">ベスト ${P.best[n]||0} / ${s.qs.length}</span></span><b>›</b></button>${wc?`<button class="btn amber" style="margin-top:12px" onclick="openStep(${n},true)">↻ 間違いだけ復習（${wc}問）</button>`:''}</div>`}).join('')}<div class="box violet"><b>学習ルール：</b>①図を見る ②面積か長さか言う ③紙に式を書く ④必要ならヒント。正解後は「なぜ？」を説明する。</div></main>`}
function quiz(){let A=list(),q=A[S.qi];app.innerHTML=`<main class="wrap"><button class="btn" onclick="home()">⌂ STEP一覧</button><p style="color:#1d4ed8;font-weight:900">${S.review?'復習：':''}${steps[S.si].name}</p><h2>問題 ${S.qi+1} / ${A.length}</h2><section class="card">${svg(q)}<h2>${q.q}</h2><div class="box" style="background:#f8fafc"><b>紙に書く：</b>①面積？長さ？ ②半径？直径？ ③何分のいくつ？ ④足す？引く？</div><div class="choices">${q.choices.map((c,n)=>`<button class="choice ${S.checked?(n===q.a?'good':S.sel===n?'bad':''):S.sel===n?'sel':''}" ${S.checked?'disabled':''} onclick="pick(${n})">${c}</button>`).join('')}</div>${!S.checked?`<div class="row"><button class="btn amber" onclick="hint()">💡 ヒント ${Math.min(S.hint+1,q.h.length)}</button><button class="btn primary" ${S.sel===null?'disabled style="opacity:.4"':''} onclick="check()">答え合わせ</button></div>${S.hint?q.h.slice(0,S.hint).map((x,n)=>`<div class="box amber"><b>ヒント${n+1}：</b>${x}</div>`).join(''):''}`:`<div class="box ${S.sel===q.a?'good':'bad'}"><b>${S.sel===q.a?'✓ 正解！':'△ おしい！'}</b>${S.sel!==q.a?`<p>正解は ${q.choices[q.a]}。図と式をつなげ直そう。</p>`:''}</div><button class="btn sky" style="margin-top:14px" onclick="toggleWork()">式を1段ずつ見る</button>${S.work?`<div class="box sky">${q.work.map(x=>`<p><b>${x}</b></p>`).join('')}</div>`:''}<div class="box" style="background:#f8fafc"><b>📘 なぜ？</b><p>${q.why}</p></div><div class="box violet"><b>★ 自分で説明</b><p><b>${q.check}</b></p></div><button class="btn primary wide" onclick="next()">${S.qi===A.length-1?'結果を見る':'次の問題へ →'}</button>`}</section></main>`}
function pick(n){S.sel=n;render()}function hint(){S.hint=Math.min(list()[S.qi].h.length,S.hint+1);render()}function toggleWork(){S.work=!S.work;render()}function check(){if(S.sel===null)return;S.checked=true;let q=list()[S.qi];if(S.sel===q.a)S.score++;else S.wrong.push(q.orig??S.qi);render()}function next(){let A=list();if(S.qi<A.length-1){S.qi++;S.sel=null;S.checked=false;S.hint=0;S.work=false;render();return}let bad=[...new Set(S.wrong)];if(S.review){let tried=new Set(A.map(x=>x.orig)),still=new Set(bad);P.wrong[S.si]=(P.wrong[S.si]||[]).filter(x=>!tried.has(x)||still.has(x))}else{P.wrong[S.si]=bad;if(!bad.length&&!P.clear.includes(S.si))P.clear.push(S.si)}P.best[S.si]=Math.max(P.best[S.si]||0,S.score);save();S.done=true;render()}function result(){let A=list();app.innerHTML=`<main class="wrap center" style="padding-top:55px"><div class="card"><div style="font-size:58px">🏆</div><h1>${S.wrong.length?'STEP終了！':'クリア！'}</h1><div class="score">${S.score}<span style="font-size:22px;color:#94a3b8"> / ${A.length}</span></div><p>${S.wrong.length?'答えより「図のどこを使うか」を見直そう。':'式の理由まで説明できたら本当に定着！'}</p><div class="row" style="justify-content:center"><button class="btn primary" onclick="openStep(${S.si},${S.review})">↻ もう一度</button><button class="btn" onclick="home()">STEP一覧</button></div></div></main>`}render();</script></body></html>
